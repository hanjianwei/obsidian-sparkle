name: Build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run release:check -- "$RELEASE_TAG"

      - name: Check code style
        run: npm run lint && npm run format:check

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: |
          package_dir=$(mktemp -d)
          mkdir "$package_dir/sparkle"
          cp main.js manifest.json styles.css LICENSE "$package_dir/sparkle/"
          cd "$package_dir"
          zip -qrX sparkle.zip sparkle
          cp sparkle.zip "$GITHUB_WORKSPACE/sparkle.zip"

      - name: Store plugin files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sparkle-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
            sparkle.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download plugin files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sparkle-${{ github.sha }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$release_draft" = "false" ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/sparkle.zip --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css release/sparkle.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
